name: Inspect even progress rail extraction references

on:
  push:
    branches:
      - agent/extract-even-progress-rail
    paths:
      - ".github/workflows/inspect-even-progress-rail-extraction.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect progress rail paths, contracts and cache assertions
        run: |
          grep -R -n -E 'even-progress-rail|desktop-shell-extraction-r56' . \
            --exclude-dir=.git \
            --exclude='module-contracts.generated.json' \
            --exclude='MODULE_CONTRACT_INVENTORY.md' || true
          echo '--- source markers ---'
          grep -n -E 'INSTALL_FLAG|MODULES|renderMasteryRail|totalLearningPoints|visualProgress|applyEvenSpacing|masteryMilestones|evenMilestone|world-progress|resize' even-progress-rail.js
