name: Validate Mystery Pack v1

on:
  pull_request:
    paths:
      - "coin-avatar-shop-reveal-v1.js"
      - "coin-avatar-shop-reveal-v1.css"
      - "coin-avatar-shard-shop-v1.js"
      - "scripts/validate-mystery-pack-v1.mjs"
      - ".github/workflows/validate-mystery-pack-v1.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-mystery-pack-v1.mjs
