name: Validate incorrect-order feedback adapter extraction

on:
  pull_request:
    paths:
      - "incorrect-order-feedback.js"
      - "incorrect-order-feedback.css"
      - "src/adapters/exercise/incorrect-order-feedback-runtime-v1.js"
      - "src/features/exercise/incorrect-order-feedback.js"
      - "src/config/course-manifest.js"
      - "service-worker.js"
      - "scripts/validate-incorrect-order-feedback-adapter-extraction.mjs"
      - "scripts/validate-ui-quality.mjs"
      - "scripts/validate-desktop-shell-module-extraction.mjs"
      - "scripts/validate-bisaya.mjs"
      - "scripts/validate_modular_bootstrap.py"
      - "scripts/generate-module-contract-inventory-v2.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - "docs/MODULE_EXTRACTION_PLAN.md"
      - ".github/workflows/validate-incorrect-order-feedback-adapter-extraction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate adapter-led extraction
        run: |
          node --check src/adapters/exercise/incorrect-order-feedback-runtime-v1.js
          node --check src/features/exercise/incorrect-order-feedback.js
          node --check incorrect-order-feedback.js
          node scripts/validate-incorrect-order-feedback-adapter-extraction.mjs
          node scripts/validate-ui-quality.mjs
          node scripts/validate-desktop-shell-module-extraction.mjs
          node scripts/validate-bisaya.mjs
          python3 scripts/validate_modular_bootstrap.py
          node scripts/generate-module-contract-inventory-v2.mjs --check
