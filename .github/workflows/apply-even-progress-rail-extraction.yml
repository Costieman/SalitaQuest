name: Apply even progress rail module extraction

on:
  push:
    branches:
      - agent/extract-even-progress-rail
    paths:
      - ".github/workflows/apply-even-progress-rail-extraction.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-even-progress-rail
      - name: Extract progress rail implementation
        run: |
          mkdir -p src/features/progression
          cp even-progress-rail.js src/features/progression/even-progress-rail.js
          cat > even-progress-rail.js <<'EOF'
          (() => {
            "use strict";

            const TARGET = "./src/features/progression/even-progress-rail.js?v=5.4.21";
            const LOADING_FLAG = "__salitaQuestEvenProgressRailCompatibilityLoading";

            if (window.__salitaQuestEvenProgressRailInstalled || window[LOADING_FLAG]) return;
            window[LOADING_FLAG] = true;

            const current = document.currentScript;
            const targetUrl = new URL(TARGET, current?.src || document.baseURI).href;
            if (document.readyState === "loading" && current) {
              document.write(`<script src="${targetUrl}"><\/script>`);
              window[LOADING_FLAG] = false;
              return;
            }

            const script = document.createElement("script");
            script.src = targetUrl;
            script.async = false;
            script.dataset.salitaCompatibilityLoader = "even-progress-rail";
            script.addEventListener("load", () => { window[LOADING_FLAG] = false; }, {once:true});
            script.addEventListener("error", () => {
              window[LOADING_FLAG] = false;
              console.error("Salita Quest could not load the extracted World Progress rail module.");
            }, {once:true});
            (document.head || document.documentElement).appendChild(script);
          })();
          EOF
          sed -i 's/^          //' even-progress-rail.js
      - name: Update manifests cache validators and documentation
        shell: python
        run: |
          from pathlib import Path

          old_current = 'salita-quest-v5-6-3-desktop-shell-extraction-r56'
          old_previous = 'salita-quest-v5-6-2-pronunciation-module-extraction-r55'
          new_current = 'salita-quest-v5-6-4-progress-rail-extraction-r57'
          placeholder = '__SQ_NEW_CACHE_R57__'

          for path in [*Path('scripts').glob('*.mjs'), *Path('scripts').glob('*.py')]:
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_current, placeholder)
              text = text.replace(old_previous, old_current)
              text = text.replace(placeholder, new_current)
              path.write_text(text, encoding='utf-8')

          manifest = Path('src/config/course-manifest.js')
          manifest_text = manifest.read_text(encoding='utf-8')
          old_asset = '"even-progress-rail.js?v=5.4.21"'
          new_asset = '"src/features/progression/even-progress-rail.js?v=5.4.21"'
          if manifest_text.count(old_asset) != 2:
              raise SystemExit('Expected exactly two progress-rail manifest references')
          manifest.write_text(manifest_text.replace(old_asset, new_asset), encoding='utf-8')

          worker = Path('service-worker.js')
          worker_text = worker.read_text(encoding='utf-8')
          old_pair = f'const PREVIOUS_CACHE_NAME = "{old_previous}";\nconst CACHE_NAME = "{old_current}";'
          new_pair = f'const PREVIOUS_CACHE_NAME = "{old_current}";\nconst CACHE_NAME = "{new_current}";'
          if old_pair not in worker_text:
              raise SystemExit('Expected r55 to r56 service-worker boundary')
          worker_text = worker_text.replace(old_pair, new_pair)
          cache_token = '  "./key-run-refinement.js", "./even-progress-rail.js", "./world-progress-status.css",'
          cache_replacement = (
              '  "./key-run-refinement.js", "./even-progress-rail.js",\n'
              '  "./src/features/progression/even-progress-rail.js", "./world-progress-status.css",'
          )
          if cache_token not in worker_text:
              raise SystemExit('Progress-rail service-worker cache token was not found')
          worker.write_text(worker_text.replace(cache_token, cache_replacement), encoding='utf-8')

          refresh = Path('mobile-refresh.html')
          refresh_text = refresh.read_text(encoding='utf-8')
          module_refresh = '      `./src/features/progression/even-progress-rail.js?v=${RELEASE}`,'
          if module_refresh not in refresh_text:
              anchor = '      `./src/features/interface/clean-topbar.js?v=${RELEASE}`,'
              if anchor not in refresh_text:
                  raise SystemExit('Mobile refresh progress-rail anchor was not found')
              refresh_text = refresh_text.replace(anchor, anchor + '\n' + module_refresh)
          refresh.write_text(refresh_text, encoding='utf-8')

          key_validator = Path('scripts/validate-key-run-refinement.mjs')
          text = key_validator.read_text(encoding='utf-8')
          text = text.replace(
              '  "even-progress-rail.js",\n  "profile-emblem-control.js",',
              '  "even-progress-rail.js",\n  "src/features/progression/even-progress-rail.js",\n  "profile-emblem-control.js",'
          )
          text = text.replace(
              'const rail = read("even-progress-rail.js");',
              'const rail = read("src/features/progression/even-progress-rail.js");'
          )
          text = text.replace(
              "  '\"./even-progress-rail.js\"'\n], \"Offline delivery\");",
              "  '\"./even-progress-rail.js\"',\n  '\"./src/features/progression/even-progress-rail.js\"'\n], \"Offline delivery\");"
          )
          key_validator.write_text(text, encoding='utf-8')

          progression_validator = Path('scripts/validate-progression-scenarios-navigation.mjs')
          text = progression_validator.read_text(encoding='utf-8')
          text = text.replace(
              '  "even-progress-rail.js",\n  "level-progression-v2.js",',
              '  "even-progress-rail.js",\n  "src/features/progression/even-progress-rail.js",\n  "level-progression-v2.js",'
          )
          text = text.replace(
              'const rail = read("even-progress-rail.js");',
              'const rail = read("src/features/progression/even-progress-rail.js");'
          )
          text = text.replace(
              '  requireMarkers(course.scripts.join("\\n"), [\n    "adaptive-scenarios.js?v=5.4.21"\n  ], `${htmlFile} progression release scripts`);',
              '  requireMarkers(course.scripts.join("\\n"), [\n    "src/features/progression/even-progress-rail.js?v=5.4.21",\n    "adaptive-scenarios.js?v=5.4.21"\n  ], `${htmlFile} progression release scripts`);'
          )
          text = text.replace(
              "  '\"./world-progress-status.css\"',",
              "  '\"./even-progress-rail.js\"',\n  '\"./src/features/progression/even-progress-rail.js\"',\n  '\"./world-progress-status.css\"',"
          )
          progression_validator.write_text(text, encoding='utf-8')

          desktop_validator = Path('scripts/validate-desktop-shell-module-extraction.mjs')
          text = desktop_validator.read_text(encoding='utf-8')
          text = text.replace(
              'scripts.indexOf("even-progress-rail.js?v=5.4.21")',
              'scripts.indexOf("src/features/progression/even-progress-rail.js?v=5.4.21")'
          )
          text = text.replace('preserved order and r56 offline delivery', 'preserved order and r57 offline delivery')
          desktop_validator.write_text(text, encoding='utf-8')

          plan = Path('docs/MODULE_EXTRACTION_PLAN.md')
          plan_text = plan.read_text(encoding='utf-8')
          plan_text = plan_text.replace(
              '3. `even-progress-rail.js` — progress presentation.',
              '3. `even-progress-rail.js` — completed as `src/features/progression/even-progress-rail.js`, with the root compatibility URL retained through r57.'
          )
          plan.write_text(plan_text, encoding='utf-8')
      - name: Add extraction-specific validator
        run: |
          cat > scripts/validate-even-progress-rail-module-extraction.mjs <<'EOF'
          import fs from "node:fs";
          import vm from "node:vm";

          const root = new URL("../", import.meta.url);
          const read = path => fs.readFileSync(new URL(path, root), "utf8");
          const fail = message => { throw new Error(message); };
          const requireMarkers = (source, markers, label) => markers.forEach(marker => {
            if (!source.includes(marker)) fail(`${label} is missing ${marker}`);
          });

          const loaderPath = "even-progress-rail.js";
          const modulePath = "src/features/progression/even-progress-rail.js";
          const loader = read(loaderPath);
          const moduleSource = read(modulePath);
          const manifestSource = read("src/config/course-manifest.js");
          const refresh = read("mobile-refresh.html");
          const worker = read("service-worker.js");

          new vm.Script(loader, {filename:loaderPath});
          new vm.Script(moduleSource, {filename:modulePath});
          new vm.Script(worker, {filename:"service-worker.js"});

          requireMarkers(loader, [
            'const TARGET = "./src/features/progression/even-progress-rail.js?v=5.4.21"',
            "document.currentScript",
            "document.write",
            "script.async = false",
            "salitaCompatibilityLoader"
          ], "Progress-rail compatibility loader");
          if (loader.includes('renderMasteryRail =') || loader.includes('window.addEventListener("resize"')) {
            fail("The root progress-rail compatibility loader must not own runtime behavior");
          }

          requireMarkers(moduleSource, [
            'const INSTALL_FLAG = "__salitaQuestEvenProgressRailInstalled"',
            'typeof MODULES === "undefined"',
            'typeof renderMasteryRail !== "function"',
            'typeof totalLearningPoints !== "function"',
            "function visualProgress(points, milestones)",
            "function applyEvenSpacing()",
            'document.getElementById("masteryMilestones")',
            'node.dataset.evenMilestone = String(number)',
            'host.style.setProperty("--world-progress"',
            "renderMasteryRailWithEvenMilestones",
            'window.addEventListener("resize", applyEvenSpacing, {passive:true})'
          ], "Extracted progress-rail module");
          if ((moduleSource.match(/renderMasteryRail\s*=\s*function/g) || []).length !== 1) {
            fail("The extracted progress rail must install exactly one renderMasteryRail wrapper");
          }
          if ((moduleSource.match(/window\.addEventListener\("resize"/g) || []).length !== 1) {
            fail("The extracted progress rail must own exactly one resize listener");
          }
          if (/\b(?:localStorage|sessionStorage)\b/.test(moduleSource)) {
            fail("The progress rail must not access learner storage");
          }

          const context = {window:{}};
          vm.createContext(context);
          vm.runInContext(manifestSource, context, {filename:"src/config/course-manifest.js"});
          const courses = context.window.SalitaQuestCourseManifest?.courses;
          const expected = "src/features/progression/even-progress-rail.js?v=5.4.21";
          if (!courses) fail("Course manifest was not installed");
          for (const courseId of ["tagalog", "cebuano"]) {
            const scripts = courses[courseId]?.scripts || [];
            const topbar = scripts.indexOf("src/features/interface/clean-topbar.js?v=5.4.21");
            const rail = scripts.indexOf(expected);
            const mastery = scripts.indexOf("mastery-feedback.js?v=5.4.21");
            if (!(topbar >= 0 && rail > topbar && mastery > rail)) {
              fail(`${courseId} does not preserve topbar → progress rail → mastery order`);
            }
            if (scripts.includes("even-progress-rail.js?v=5.4.21")) {
              fail(`${courseId} still loads the root progress-rail compatibility URL directly`);
            }
          }

          if (!refresh.includes(modulePath)) fail("Mobile refresh does not fetch the extracted progress rail");
          requireMarkers(worker, [
            'const PREVIOUS_CACHE_NAME = "salita-quest-v5-6-3-desktop-shell-extraction-r56"',
            'const CACHE_NAME = "salita-quest-v5-6-4-progress-rail-extraction-r57"',
            '"./even-progress-rail.js"',
            '"./src/features/progression/even-progress-rail.js"'
          ], "Progress-rail offline contract");

          console.log("Even progress-rail extraction validation passed: direct progression module, compatibility-only root loader, one wrapper, one resize listener and r57 offline delivery.");
          EOF
          sed -i 's/^          //' scripts/validate-even-progress-rail-module-extraction.mjs
      - name: Regenerate module contract inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --write
      - name: Validate extraction and integrations
        run: |
          node --check even-progress-rail.js
          node --check src/features/progression/even-progress-rail.js
          node --check scripts/validate-even-progress-rail-module-extraction.mjs
          node scripts/validate-even-progress-rail-module-extraction.mjs
          node scripts/validate-key-run-refinement.mjs
          node scripts/validate-progression-scenarios-navigation.mjs
          node scripts/validate-desktop-shell-module-extraction.mjs
          node scripts/validate-home-dashboard.mjs
          node scripts/generate-module-contract-inventory-v2.mjs --check
          python scripts/validate_modular_bootstrap.py
          node scripts/validate-bisaya-audio-library.mjs
          node scripts/validate-avatar-progression-v550.mjs
          git diff --check
      - name: Commit progress rail extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-even-progress-rail-extraction.yml
          git rm .github/workflows/inspect-even-progress-rail-extraction.yml
          git add -A
          git commit -m "Extract even progress rail module"
          git push origin HEAD:agent/extract-even-progress-rail
