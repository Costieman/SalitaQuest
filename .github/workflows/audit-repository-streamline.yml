name: Audit repository streamlining

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate repository audit
        run: node scripts/audit-repository-streamline.mjs

      - name: Trace remaining legacy asset references
        run: node scripts/audit-reference-sources.mjs rare-animals-set2-sprite.png

      - name: Upload repository audit
        uses: actions/upload-artifact@v4
        with:
          name: repository-streamline-audit
          path: artifacts/repository-*
          if-no-files-found: error
          retention-days: 14
