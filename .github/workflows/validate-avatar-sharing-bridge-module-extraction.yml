name: Validate avatar sharing bridge module extraction

on:
  pull_request:
    paths:
      - "achievement-sharing-avatar-bridge-v1.js"
      - "src/features/sharing/achievement-sharing-avatar-bridge-v1.js"
      - "src/adapters/avatar/avatar-collection-profile-runtime-v1.js"
      - "profile-emblem-control.js"
      - "mobile-refresh.html"
      - "service-worker.js"
      - "scripts/validate-avatar-sharing-bridge-module-extraction.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - ".github/workflows/validate-avatar-sharing-bridge-module-extraction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate avatar sharing bridge boundary
        run: node scripts/validate-avatar-sharing-bridge-module-extraction.mjs
      - name: Validate avatar unlock sharing
        run: node scripts/validate-avatar-unlock-sharing.mjs
      - name: Validate achievement image transport
        run: node scripts/validate-achievement-image-transport.mjs
      - name: Validate deterministic inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - name: Check whitespace
        run: git diff --check
