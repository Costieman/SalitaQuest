name: Validate Avatar Progression 5.5

on:
  pull_request:
    paths:
      - "avatars/**"
      - "avatar-*.js"
      - "avatar-*.css"
      - "weekly-avatar-*.js"
      - "weekly-avatar-*.css"
      - "level-avatar-*.js"
      - "achievement-sharing-avatar-bridge-v1.js"
      - "profile-app.js"
      - "profile-emblem-control.js"
      - "service-worker.js"
      - "README.md"
      - "docs/releases/**"
      - "scripts/validate-*.mjs"
      - "scripts/build-canonical-avatars-v556*.py"
      - ".github/workflows/validate-avatar-progression-v550.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-avatar-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical avatar assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow pillow-avif-plugin cairosvg
          python scripts/build-canonical-avatars-v556-tolerant.py
      - name: Commit generated assets to the branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/${{ github.base_ref }} -- .github/workflows/validate-avatar-progression-v550.yml
          if git diff --quiet -- avatars/canonical .github/workflows/validate-avatar-progression-v550.yml; then
            echo "Canonical assets are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add avatars/canonical .github/workflows/validate-avatar-progression-v550.yml
            git commit -m "Generate 48 canonical avatar PNG assets"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check whitespace
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
      - name: Run Avatar Progression integration validation
        run: node scripts/validate-avatar-progression-v550.mjs
