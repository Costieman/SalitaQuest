name: Inspect level-up extraction references

on:
  push:
    branches:
      - agent/extract-level-up-mobile-safety
    paths:
      - ".github/workflows/inspect-level-up-extraction.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find extraction references
        run: |
          grep -R -n -E 'level-up-mobile-safety-v552|salita-quest-v5-6-0-modular-bootstrap-r53' . \
            --exclude-dir=.git \
            --exclude='module-contracts.generated.json' \
            --exclude='MODULE_CONTRACT_INVENTORY.md' || true
