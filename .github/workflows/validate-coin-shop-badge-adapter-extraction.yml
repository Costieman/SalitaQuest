name: Validate coin shop badge adapter extraction

on:
  push:
    paths:
      - "coin-avatar-shop-badges-v1.js"
      - "src/adapters/badges/coin-shop-badge-runtime-v1.js"
      - "src/features/economy/coin-avatar-shop-badges-v1.js"
      - "profile-emblem-control.js"
      - "service-worker.js"
      - "scripts/validate-coin-shop-badge-adapter-extraction.mjs"
      - "scripts/validate-coin-avatar-shop.mjs"
      - "scripts/validate-level-avatar-rewards-module-extraction.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - ".github/workflows/validate-coin-shop-badge-adapter-extraction.yml"
  pull_request:
    paths:
      - "coin-avatar-shop-badges-v1.js"
      - "src/adapters/badges/coin-shop-badge-runtime-v1.js"
      - "src/features/economy/coin-avatar-shop-badges-v1.js"
      - "profile-emblem-control.js"
      - "service-worker.js"
      - "scripts/validate-coin-shop-badge-adapter-extraction.mjs"
      - "scripts/validate-coin-avatar-shop.mjs"
      - "scripts/validate-level-avatar-rewards-module-extraction.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - ".github/workflows/validate-coin-shop-badge-adapter-extraction.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate adapter boundaries and compatibility
        run: node scripts/validate-coin-shop-badge-adapter-extraction.mjs
      - name: Validate coin shop and badge integration
        run: |
          node scripts/validate-coin-avatar-shop.mjs
          node scripts/validate-badge-stability.mjs
          node scripts/validate-long-term-badges.mjs
          node scripts/validate-economy-tracking-module-extraction.mjs
          node scripts/validate-level-avatar-rewards-module-extraction.mjs
      - name: Validate deterministic inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - name: Check whitespace
        run: git diff --check
