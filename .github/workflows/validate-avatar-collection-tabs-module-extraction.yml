name: Validate Avatar Collection tabs module extraction
on:
  pull_request:
    paths:
      - 'avatar-collection-tabs-phase6-1-v1.js'
      - 'src/features/avatar/avatar-collection-tabs-phase6-1-v1.js'
      - 'avatar-collection-tabs-phase6-1-v1.css'
      - 'coin-avatar-shop-topbar-v1.js'
      - 'service-worker.js'
      - 'scripts/validate-avatar-collection-tabs-module-extraction.mjs'
      - 'scripts/validate-phase6-1-tabs-case.mjs'
      - 'scripts/validate-avatar-three-tabs.mjs'
      - 'scripts/validate-avatar-collection-pane-flow.mjs'
      - 'src/config/module-contracts.generated.json'
      - 'docs/MODULE_CONTRACT_INVENTORY.md'
      - '.github/workflows/validate-avatar-collection-tabs-module-extraction.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tabs extraction
        run: node scripts/validate-avatar-collection-tabs-module-extraction.mjs
      - name: Validate pane and three-tab integration
        run: |
          node scripts/validate-phase6-1-tabs-case.mjs
          node scripts/validate-avatar-three-tabs.mjs
          node scripts/validate-avatar-collection-pane-flow.mjs
          node scripts/validate-economy-tracking-module-extraction.mjs
          node scripts/validate-economy-v2-phase6.mjs
      - name: Validate Avatar Progression integration
        run: node scripts/validate-avatar-progression-v550.mjs
      - name: Validate Bisaya and modular bootstrap
        run: |
          node scripts/validate-bisaya-audio-library.mjs
          python3 scripts/validate_modular_bootstrap.py
      - name: Validate deterministic contract inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - name: Check whitespace
        run: git diff --check
