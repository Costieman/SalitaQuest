name: Inspect avatar progression hotfix extraction
on:
  push:
    branches:
      - agent/audit-avatar-progression-hotfix-extraction
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect ownership and consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== target metadata ==='
          wc -l -c avatar-progression-hotfix-v551.js
          sha256sum avatar-progression-hotfix-v551.js
          node --check avatar-progression-hotfix-v551.js
          echo '=== exact target/API/event references ==='
          rg -n --hidden \
            --glob '!node_modules/**' --glob '!.git/**' \
            'avatar-progression-hotfix-v551\.js|SalitaAvatarHotfixReady|__salitaQuestCollectionsNavigationV551Installed|salita:avatar-model-hotfixed|hotfixRelease' . || true
          echo '=== avatar model owners and consumers ==='
          rg -n --hidden \
            --glob '!node_modules/**' --glob '!.git/**' \
            'SalitaAvatarModel|SalitaAvatarCatalogue|normaliseCollectionState|weeklyShardAward|levelRewards' . || true
          echo '=== navigation engine ownership ==='
          rg -n --hidden \
            --glob '!node_modules/**' --glob '!.git/**' \
            '(^|[^A-Za-z0-9_])(switchView|closeMobileMenu|renderBadges)([^A-Za-z0-9_]|$)|collectionsView|data-open-badge-collection|data-open-avatar-collection-main' . || true
          echo '=== service worker cache names and target assets ==='
          rg -n 'PREVIOUS_CACHE_NAME|CACHE_NAME|avatar-progression-hotfix-v551' service-worker.js scripts .github/workflows || true
          echo '=== generated inventory entry ==='
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('src/config/module-contracts.generated.json','utf8'));
          const text=JSON.stringify(data,null,2).split('\n');
          text.forEach((line,index)=>{if(line.includes('avatar-progression-hotfix-v551')) console.log(`${index+1}:${line}`);});
          NODE
