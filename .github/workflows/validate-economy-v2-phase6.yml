name: Validate Economy v2 Phase 6

on:
  pull_request:
    paths:
      - "economy-tracking-phase6-v1.js"
      - "economy-tracking-phase6-v1.css"
      - "coin-avatar-shop-topbar-v1.js"
      - "scripts/validate-economy-v2-phase6.mjs"
      - ".github/workflows/validate-economy-v2-phase6.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Phase 6 economy tracking and Avatar Case
        run: node scripts/validate-economy-v2-phase6.mjs
