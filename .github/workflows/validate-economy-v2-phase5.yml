name: Validate Economy v2 Phase 5

on:
  pull_request:
    paths:
      - "avatar-collection-summary-v1.js"
      - "avatar-collection-summary-v1.css"
      - "coin-testing-grant-50k-phase5-v1.js"
      - "coin-avatar-shop-topbar-v1.js"
      - "scripts/validate-economy-v2-phase5.mjs"
      - ".github/workflows/validate-economy-v2-phase5.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Phase 5 collection summary and grant
        run: node scripts/validate-economy-v2-phase5.mjs