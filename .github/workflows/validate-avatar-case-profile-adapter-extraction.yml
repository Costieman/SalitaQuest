name: Validate Avatar Case profile adapter extraction

on:
  pull_request:
    paths:
      - "avatar-case-v1.js"
      - "src/adapters/avatar/avatar-case-profile-runtime-v1.js"
      - "src/features/avatar/avatar-case-v1.js"
      - "profile-emblem-control.js"
      - "service-worker.js"
      - "scripts/validate-avatar-case-profile-adapter-extraction.mjs"
      - "scripts/validate-avatar-case.mjs"
      - "scripts/validate-avatar-progression-v550.mjs"
      - "scripts/validate-avatar-runtime-v556.mjs"
      - "scripts/generate-module-contract-inventory-v2.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - ".github/workflows/validate-avatar-case-profile-adapter-extraction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate extracted ownership and behavior
        run: |
          node --check avatar-case-v1.js
          node --check src/adapters/avatar/avatar-case-profile-runtime-v1.js
          node --check src/features/avatar/avatar-case-v1.js
          node scripts/validate-avatar-case-profile-adapter-extraction.mjs
          node scripts/validate-avatar-case.mjs
          node scripts/validate-avatar-case-mobile-flow-hotfix.mjs
          node scripts/validate-avatar-collection-pane-flow.mjs
          node scripts/validate-avatar-progression-v550.mjs
          node scripts/generate-module-contract-inventory-v2.mjs --check
          python3 scripts/validate_modular_bootstrap.py
          git diff --check
