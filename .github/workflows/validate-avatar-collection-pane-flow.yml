name: Validate Avatar Collection pane flow

on:
  pull_request:
    paths:
      - 'avatar-collection-tabs-phase6-1-v1.js'
      - 'avatar-collection-tabs-phase6-1-v1.css'
      - 'economy-tracking-phase6-v1.js'
      - 'coin-avatar-shop-topbar-v1.js'
      - 'scripts/validate-avatar-collection-pane-flow.mjs'
      - '.github/workflows/validate-avatar-collection-pane-flow.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check avatar-collection-tabs-phase6-1-v1.js
      - run: node --check economy-tracking-phase6-v1.js
      - run: node scripts/validate-avatar-collection-pane-flow.mjs
