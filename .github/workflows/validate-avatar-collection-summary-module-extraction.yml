name: Validate Avatar Collection summary module extraction
on:
  pull_request:
    paths:
      - 'avatar-collection-summary-v1.js'
      - 'src/features/avatar/avatar-collection-summary-v1.js'
      - 'avatar-collection-summary-v1.css'
      - 'coin-avatar-shop-topbar-v1.js'
      - 'service-worker.js'
      - 'scripts/validate-avatar-collection-summary-module-extraction.mjs'
      - 'scripts/validate-economy-v2-phase5.mjs'
      - 'scripts/validate-economy-tracking-module-extraction.mjs'
      - 'scripts/validate-avatar-collection-tabs-module-extraction.mjs'
      - 'scripts/validate-avatar-collection-pane-flow.mjs'
      - 'scripts/validate-avatar-progression-v550.mjs'
      - 'scripts/validate-bisaya-audio-library.mjs'
      - 'scripts/validate_modular_bootstrap.py'
      - 'scripts/generate-module-contract-inventory-v2.mjs'
      - 'src/config/module-contracts.generated.json'
      - '.github/workflows/validate-avatar-collection-summary-module-extraction.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate summary extraction
        run: |
          node --check avatar-collection-summary-v1.js
          node --check src/features/avatar/avatar-collection-summary-v1.js
          node scripts/validate-avatar-collection-summary-module-extraction.mjs
      - name: Validate collection and economy integration
        run: |
          node scripts/validate-economy-v2-phase5.mjs
          node scripts/validate-economy-tracking-module-extraction.mjs
          node scripts/validate-avatar-collection-tabs-module-extraction.mjs
          node scripts/validate-avatar-collection-pane-flow.mjs
      - name: Validate Avatar Progression integration
        run: node scripts/validate-avatar-progression-v550.mjs
      - name: Validate Bisaya and modular bootstrap
        run: |
          node scripts/validate-bisaya-audio-library.mjs
          python3 scripts/validate_modular_bootstrap.py
      - name: Validate deterministic contract inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - name: Check whitespace
        run: git diff --check
