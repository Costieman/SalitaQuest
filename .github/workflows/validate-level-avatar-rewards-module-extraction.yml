name: Validate level avatar rewards module extraction
on:
  pull_request:
    paths:
      - 'level-avatar-rewards-v1.js'
      - 'src/features/avatar/level-avatar-rewards-v1.js'
      - 'profile-emblem-control.js'
      - 'mobile-refresh.html'
      - 'service-worker.js'
      - 'scripts/validate-level-avatar-rewards-module-extraction.mjs'
      - 'scripts/validate-level-avatar-rewards.mjs'
      - 'scripts/validate-avatar-unlock-sharing.mjs'
      - 'scripts/validate-stage1-popup-governance-v553.mjs'
      - 'scripts/validate-avatar-runtime-v556.mjs'
      - 'scripts/validate-avatar-progression-v550.mjs'
      - 'scripts/validate-popup-governor-module-extraction.mjs'
      - 'scripts/validate-mobile-level-up-hotfix-v552.mjs'
      - 'scripts/validate-placement-sharing.mjs'
      - 'scripts/validate-bisaya-audio-library.mjs'
      - 'scripts/validate_modular_bootstrap.py'
      - 'scripts/generate-module-contract-inventory-v2.mjs'
      - 'src/config/module-contracts.generated.json'
      - '.github/workflows/validate-level-avatar-rewards-module-extraction.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate reward extraction and persistence
        run: |
          node --check level-avatar-rewards-v1.js
          node --check src/features/avatar/level-avatar-rewards-v1.js
          node scripts/validate-level-avatar-rewards-module-extraction.mjs
          node scripts/validate-level-avatar-rewards.mjs
      - name: Validate governed popup and unlock integration
        run: |
          node scripts/validate-stage1-popup-governance-v553.mjs
          node scripts/validate-avatar-unlock-sharing.mjs
          node scripts/validate-popup-governor-module-extraction.mjs
          node scripts/validate-mobile-level-up-hotfix-v552.mjs
          node scripts/validate-placement-sharing.mjs
      - name: Validate avatar and course integration
        run: |
          node scripts/validate-avatar-runtime-v556.mjs
          node scripts/validate-avatar-progression-v550.mjs
          node scripts/validate-bisaya-audio-library.mjs
          python3 scripts/validate_modular_bootstrap.py
      - name: Validate deterministic contract inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - name: Check whitespace
        run: git diff --check
