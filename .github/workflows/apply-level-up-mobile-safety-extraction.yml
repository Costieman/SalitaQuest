name: Apply level-up mobile-safety extraction

on:
  push:
    branches:
      - agent/extract-level-up-mobile-safety
    paths:
      - ".github/workflows/apply-level-up-mobile-safety-extraction.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-level-up-mobile-safety
      - name: Extract implementation and preserve compatibility URL
        shell: python
        run: |
          from pathlib import Path

          root = Path("level-up-mobile-safety-v552.js")
          module = Path("src/features/interface/level-up-mobile-safety-v552.js")
          manifest = Path("src/config/course-manifest.js")
          worker = Path("service-worker.js")

          original = root.read_text(encoding="utf-8")
          if "SalitaLevelUpMobileSafety" not in original or "INSTALL_FLAG" not in original:
              raise SystemExit("Unexpected root implementation; refusing extraction")

          module.parent.mkdir(parents=True, exist_ok=True)
          module.write_text(original, encoding="utf-8")

          loader = '''(() => {
            "use strict";

            const TARGET = "./src/features/interface/level-up-mobile-safety-v552.js?v=5.5.3";
            const LOADING_FLAG = "__salitaQuestLevelUpMobileSafetyV552CompatibilityLoading";

            if (window.SalitaLevelUpMobileSafety || window[LOADING_FLAG]) return;
            window[LOADING_FLAG] = true;

            const current = document.currentScript;
            const targetUrl = new URL(TARGET, current?.src || document.baseURI).href;
            if (document.readyState === "loading" && current) {
              document.write(`<script src="${targetUrl}"><\\/script>`);
              window[LOADING_FLAG] = false;
              return;
            }

            const script = document.createElement("script");
            script.src = targetUrl;
            script.async = false;
            script.dataset.salitaCompatibilityLoader = "level-up-mobile-safety-v552";
            script.addEventListener("load", () => { window[LOADING_FLAG] = false; }, {once:true});
            script.addEventListener("error", () => {
              window[LOADING_FLAG] = false;
              console.error("Salita Quest could not load the extracted level-up mobile-safety module.");
            }, {once:true});
            (document.head || document.documentElement).appendChild(script);
          })();
          '''
          root.write_text(loader, encoding="utf-8")

          manifest_text = manifest.read_text(encoding="utf-8")
          old_asset = '"level-up-mobile-safety-v552.js?v=5.5.3"'
          new_asset = '"src/features/interface/level-up-mobile-safety-v552.js?v=5.5.3"'
          if manifest_text.count(old_asset) != 2:
              raise SystemExit("Expected two course-manifest references to the root module")
          manifest.write_text(manifest_text.replace(old_asset, new_asset), encoding="utf-8")

          worker_text = worker.read_text(encoding="utf-8")
          old_previous = 'const PREVIOUS_CACHE_NAME = "salita-quest-v5-5-10-persistent-navigation-r52";'
          old_current = 'const CACHE_NAME = "salita-quest-v5-6-0-modular-bootstrap-r53";'
          if old_previous not in worker_text or old_current not in worker_text:
              raise SystemExit("Unexpected service-worker cache boundary")
          worker_text = worker_text.replace(
              old_previous,
              'const PREVIOUS_CACHE_NAME = "salita-quest-v5-6-0-modular-bootstrap-r53";'
          ).replace(
              old_current,
              'const CACHE_NAME = "salita-quest-v5-6-1-first-module-extraction-r54";'
          )
          old_cache_entry = '"./level-progression-v2.js", "./level-progression-v2.css", "./level-up-mobile-safety-v552.js",'
          new_cache_entry = '"./level-progression-v2.js", "./level-progression-v2.css", "./level-up-mobile-safety-v552.js",\n  "./src/features/interface/level-up-mobile-safety-v552.js",'
          if old_cache_entry not in worker_text:
              raise SystemExit("Root compatibility cache entry was not found")
          worker.write_text(worker_text.replace(old_cache_entry, new_cache_entry), encoding="utf-8")
      - name: Regenerate module contract inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --write
      - name: Validate generated state
        run: |
          node --check level-up-mobile-safety-v552.js
          node --check src/features/interface/level-up-mobile-safety-v552.js
          node --check src/config/course-manifest.js
          node --check service-worker.js
          node scripts/generate-module-contract-inventory-v2.mjs --check
          git diff --check
      - name: Commit extracted module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-level-up-mobile-safety-extraction.yml
          git add level-up-mobile-safety-v552.js \
            src/features/interface/level-up-mobile-safety-v552.js \
            src/config/course-manifest.js \
            service-worker.js \
            docs/MODULE_CONTRACT_INVENTORY.md \
            src/config/module-contracts.generated.json
          git commit -m "Extract level-up mobile safety module"
          git push origin HEAD:agent/extract-level-up-mobile-safety
