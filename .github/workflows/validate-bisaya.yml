name: Validate Bisaya edition

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/bisaya-**"
      - "agent/dark-mode-**"
      - "agent/progression-**"
      - "agent/audio-**"
      - "agent/placement-**"
      - "agent/social-**"
      - "agent/hosted-**"
      - "agent/individual-**"
      - "agent/badge-**"
      - "agent/avatar-**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Bisaya course and scripts
        run: node scripts/validate-bisaya.mjs
      - name: Validate shared UI quality release
        run: node scripts/validate-ui-quality.mjs
      - name: Validate compact home dashboard
        run: node scripts/validate-home-dashboard.mjs
      - name: Validate mobile session refinement
        run: node scripts/validate-mobile-refinement.mjs
      - name: Validate key-run progression refinement
        run: node scripts/validate-key-run-refinement.mjs
      - name: Validate progression scenarios and navigation
        run: node scripts/validate-progression-scenarios-navigation.mjs
      - name: Validate audio badges and reward coordination
        run: node scripts/validate-audio-badge-release.mjs
      - name: Validate placement and badge catalogue
        run: node scripts/validate-placement-sharing.mjs
      - name: Validate social service and resumable Cebuano audio
        run: node scripts/validate-social-posting-audio-resume.mjs
      - name: Validate hosted achievement previews
        run: node scripts/validate-hosted-achievement-sharing.mjs
      - name: Validate Badge Chest and achievement sharing stability
        run: node scripts/validate-badge-stability.mjs
      - name: Validate avatar collection and progression
        run: node scripts/validate-avatar-collection.mjs
