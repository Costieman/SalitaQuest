name: Validate Economy v2 Phase 1

on:
  pull_request:
    paths:
      - "daily-goal-refinement.js"
      - "scripts/validate-economy-v2-phase1.mjs"
      - ".github/workflows/validate-economy-v2-phase1.yml"
  push:
    branches: [main]
    paths:
      - "daily-goal-refinement.js"
      - "scripts/validate-economy-v2-phase1.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Economy v2 Phase 1
        run: node scripts/validate-economy-v2-phase1.mjs
