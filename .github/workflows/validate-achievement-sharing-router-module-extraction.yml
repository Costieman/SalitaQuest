name: Validate achievement sharing router module extraction
on:
  pull_request:
    paths:
      - achievement-sharing-router-v2.js
      - achievement-sharing-router-v3.js
      - src/features/sharing/achievement-sharing-router-v3.js
      - scripts/validate-achievement-sharing-router-module-extraction.mjs
      - scripts/validate-achievement-image-transport.mjs
      - scripts/validate-avatar-progression-v550.mjs
      - service-worker.js
      - src/config/module-contracts.generated.json
      - docs/MODULE_CONTRACT_INVENTORY.md
      - docs/MODULE_EXTRACTION_PLAN.md
      - .github/workflows/validate-achievement-sharing-router-module-extraction.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate extraction contract
        run: node scripts/validate-achievement-sharing-router-module-extraction.mjs
      - name: Validate sharing image transport
        run: node scripts/validate-achievement-image-transport.mjs
      - name: Validate integrated avatar progression
        run: node scripts/validate-avatar-progression-v550.mjs
      - name: Verify deterministic contract inventory
        run: |
          node scripts/generate-module-contract-inventory-v2.mjs --check
          git diff --exit-code
