name: Validate Phase 6.1 collection tabs and Avatar Case

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tabs and case layout
        run: node scripts/validate-phase6-1-tabs-case.mjs
