name: Validate long-term badge adapter extraction

on:
  pull_request:
    paths:
      - "long-term-badges-v1.js"
      - "src/adapters/badges/badge-catalogue-runtime-v1.js"
      - "src/features/badges/long-term-badges-v1.js"
      - "profile-emblem-control.js"
      - "service-worker.js"
      - "scripts/validate-long-term-badge-adapter-extraction.mjs"
      - "scripts/validate-long-term-badges.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - ".github/workflows/validate-long-term-badge-adapter-extraction.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate adapter boundary
        run: node scripts/validate-long-term-badge-adapter-extraction.mjs
      - name: Validate long-term badge behavior
        run: node scripts/validate-long-term-badges.mjs
      - name: Validate badge stability
        run: node scripts/validate-badge-stability.mjs
      - name: Validate parent badge adapter
        run: node scripts/validate-coin-shop-badge-adapter-extraction.mjs
      - name: Validate profile loader integration
        run: node scripts/validate-avatar-progression-v550.mjs
      - name: Validate modular bootstrap
        run: python3 scripts/validate_modular_bootstrap.py
      - name: Validate deterministic inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
