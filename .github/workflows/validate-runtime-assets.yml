name: Validate runtime graph

on:
  workflow_dispatch:
  push:
    branches:
      - sandbox/refactor-audit-v1
    paths:
      - "index.html"
      - "app.html"
      - "bisaya.html"
      - "mobile-refresh.html"
      - "service-worker.js"
      - "src/**"
      - "*.js"
      - "*.css"
      - "scripts/audit-runtime-assets.mjs"
      - ".github/workflows/validate-runtime-assets.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.html"
      - "bisaya.html"
      - "mobile-refresh.html"
      - "service-worker.js"
      - "src/**"
      - "*.js"
      - "*.css"
      - "scripts/audit-runtime-assets.mjs"
      - ".github/workflows/validate-runtime-assets.yml"

permissions:
  contents: read

jobs:
  runtime-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build runtime reachability report
        run: node scripts/audit-runtime-assets.mjs
      - name: Reject dead or historically versioned runtime code
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("audit/runtime-assets.json", "utf8"));
          const guarded = {
            unreachableCodeFiles: report.counts.unreachableCodeFiles,
            versionedReachableFiles: report.counts.versionedReachableFiles,
            precacheOnlyFiles: report.counts.precacheOnlyFiles
          };
          const failures = Object.entries(guarded).filter(([, count]) => count !== 0);
          if (failures.length) {
            console.error("Runtime graph is no longer minimal:", guarded);
            process.exit(1);
          }
          console.log("Runtime graph is minimal:", guarded);
          NODE
      - name: Parse-check reachable JavaScript
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const {execFileSync} = require("node:child_process");
          const report = JSON.parse(fs.readFileSync("audit/runtime-assets.json", "utf8"));
          const scripts = report.reachable
            .map(item => item.file)
            .filter(file => file.endsWith(".js"));
          for (const file of scripts) {
            execFileSync(process.execPath, ["--check", file], {stdio: "inherit"});
          }
          console.log(`Parse-checked ${scripts.length} reachable JavaScript files.`);
          NODE
      - name: Upload runtime audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-asset-audit
          path: audit/
