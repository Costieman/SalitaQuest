name: Validate home reward coordinator module extraction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate coordinator extraction
        run: node scripts/validate-home-reward-coordinator-module-extraction.mjs
      - name: Validate audio, badges and reward ordering
        run: node scripts/validate-audio-badge-release.mjs
      - name: Validate home dashboard
        run: node scripts/validate-home-dashboard.mjs
      - name: Validate key-run state contracts
        run: node scripts/validate-key-run-refinement.mjs
      - name: Validate pronunciation ordering
        run: node scripts/validate-pronunciation-module-extraction.mjs
      - name: Validate Avatar Progression integration
        run: node scripts/validate-avatar-progression-v550.mjs
      - name: Validate Bisaya audio library
        run: node scripts/validate-bisaya-audio-library.mjs
      - name: Validate modular bootstrap
        run: python3 scripts/validate_modular_bootstrap.py
      - name: Validate deterministic contract inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs
      - name: Check whitespace
        run: git diff --check
