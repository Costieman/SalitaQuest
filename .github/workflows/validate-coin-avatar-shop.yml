name: Validate coin avatar shard shop

on:
  pull_request:
    paths:
      - "coin-avatar-shard-shop-v1.js"
      - "coin-avatar-shard-shop-v1.css"
      - "coin-avatar-shop-badges-v1.js"
      - "profile-emblem-control.js"
      - "weekly-avatar-shard-rewards-v1.js"
      - "scripts/validate-coin-avatar-shop.mjs"
      - ".github/workflows/validate-coin-avatar-shop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-coin-avatar-shop.mjs
