name: Validate avatar artwork registry module extraction
on:
  pull_request:
    paths:
      - avatar-artwork-registry-v554.js
      - src/features/avatar/avatar-artwork-registry-v554.js
      - src/features/avatar/avatar-catalogue-v1.js
      - profile-emblem-control.js
      - mobile-refresh.html
      - service-worker.js
      - scripts/validate-avatar-artwork-registry-module-extraction.mjs
      - scripts/validate-avatar-data-migration-module-extraction.mjs
      - scripts/validate-avatar-runtime-v556.mjs
      - scripts/validate-avatar-progression-v550.mjs
      - scripts/validate-avatar-catalogue.mjs
      - scripts/generate-module-contract-inventory-v2.mjs
      - src/config/module-contracts.generated.json
      - docs/MODULE_CONTRACT_INVENTORY.md
      - .github/workflows/validate-avatar-artwork-registry-module-extraction.yml
  push:
    branches:
      - main
    paths:
      - avatar-artwork-registry-v554.js
      - src/features/avatar/avatar-artwork-registry-v554.js
      - src/features/avatar/avatar-catalogue-v1.js
      - profile-emblem-control.js
      - mobile-refresh.html
      - service-worker.js
      - scripts/validate-avatar-artwork-registry-module-extraction.mjs
      - scripts/validate-avatar-data-migration-module-extraction.mjs
      - scripts/validate-avatar-runtime-v556.mjs
      - scripts/validate-avatar-progression-v550.mjs
      - scripts/validate-avatar-catalogue.mjs
      - scripts/generate-module-contract-inventory-v2.mjs
      - src/config/module-contracts.generated.json
      - docs/MODULE_CONTRACT_INVENTORY.md
      - .github/workflows/validate-avatar-artwork-registry-module-extraction.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate artwork registry extraction
        run: |
          node scripts/validate-avatar-artwork-registry-module-extraction.mjs
          node scripts/validate-avatar-data-migration-module-extraction.mjs
          node scripts/validate-avatar-runtime-v556.mjs
          node scripts/validate-avatar-progression-v550.mjs
          node scripts/validate-avatar-catalogue.mjs
          node scripts/generate-module-contract-inventory-v2.mjs --check
          git diff --exit-code
