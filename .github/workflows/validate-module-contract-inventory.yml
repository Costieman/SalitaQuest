name: Validate module contract inventory

on:
  pull_request:
    paths:
      - "*.js"
      - "mobile-refresh.html"
      - "src/**/*.js"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - "docs/MODULE_EXTRACTION_PLAN.md"
      - "scripts/generate-module-contract-inventory-v2.mjs"
      - "scripts/validate-mobile-level-up-hotfix-v552.mjs"
      - ".github/workflows/validate-module-contract-inventory.yml"
  push:
    branches:
      - main
      - agent/modular-refactor-foundation
      - agent/module-contract-inventory
      - agent/extract-level-up-mobile-safety
    paths:
      - "*.js"
      - "mobile-refresh.html"
      - "src/**/*.js"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - "docs/MODULE_EXTRACTION_PLAN.md"
      - "scripts/generate-module-contract-inventory-v2.mjs"
      - "scripts/validate-mobile-level-up-hotfix-v552.mjs"
      - ".github/workflows/validate-module-contract-inventory.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check scanner syntax
        run: node --check scripts/generate-module-contract-inventory-v2.mjs
      - name: Validate generated inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - name: Validate first module extraction
        run: node scripts/validate-mobile-level-up-hotfix-v552.mjs
      - name: Check whitespace
        run: git diff --check
