name: Validate avatar data and migration module extraction

on:
  pull_request:
    paths:
      - "avatar-catalogue-v1.js"
      - "avatar-progression-migration-v1.js"
      - "src/features/avatar/avatar-catalogue-v1.js"
      - "src/features/avatar/avatar-progression-migration-v1.js"
      - "index.html"
      - "profile-app.js"
      - "profile-emblem-control.js"
      - "mobile-refresh.html"
      - "service-worker.js"
      - "scripts/validate-avatar-data-migration-module-extraction.mjs"
      - "scripts/validate-avatar-catalogue.mjs"
      - "scripts/validate-avatar-onboarding.mjs"
      - "scripts/validate-avatar-collection-screen.mjs"
      - "scripts/validate-level-avatar-rewards.mjs"
      - "scripts/validate-avatar-runtime-v556.mjs"
      - "scripts/validate-avatar-progression-v550.mjs"
      - "scripts/generate-module-contract-inventory-v2.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - "docs/MODULE_EXTRACTION_PLAN.md"
      - ".github/workflows/validate-avatar-data-migration-module-extraction.yml"
  push:
    branches:
      - main
    paths:
      - "avatar-catalogue-v1.js"
      - "avatar-progression-migration-v1.js"
      - "src/features/avatar/avatar-catalogue-v1.js"
      - "src/features/avatar/avatar-progression-migration-v1.js"
      - "index.html"
      - "profile-app.js"
      - "profile-emblem-control.js"
      - "mobile-refresh.html"
      - "service-worker.js"
      - "scripts/validate-avatar-data-migration-module-extraction.mjs"
      - "scripts/validate-avatar-catalogue.mjs"
      - "scripts/validate-avatar-onboarding.mjs"
      - "scripts/validate-avatar-collection-screen.mjs"
      - "scripts/validate-level-avatar-rewards.mjs"
      - "scripts/validate-avatar-runtime-v556.mjs"
      - "scripts/validate-avatar-progression-v550.mjs"
      - "scripts/generate-module-contract-inventory-v2.mjs"
      - "src/config/module-contracts.generated.json"
      - "docs/MODULE_CONTRACT_INVENTORY.md"
      - "docs/MODULE_EXTRACTION_PLAN.md"
      - ".github/workflows/validate-avatar-data-migration-module-extraction.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-avatar-data-migration-module-extraction.mjs
      - run: node scripts/validate-avatar-catalogue.mjs
      - run: node scripts/validate-avatar-onboarding.mjs
      - run: node scripts/validate-avatar-collection-screen.mjs
      - run: node scripts/validate-level-avatar-rewards.mjs
      - run: node scripts/validate-avatar-runtime-v556.mjs
      - run: node scripts/validate-avatar-progression-v550.mjs
      - run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - run: git diff --check
