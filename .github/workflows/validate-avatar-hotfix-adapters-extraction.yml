name: Validate avatar hotfix adapters extraction
on:
  push:
    paths:
      - avatar-progression-hotfix-v551.js
      - src/features/avatar/avatar-progression-model-v551.js
      - src/adapters/navigation/avatar-collections-navigation-v551.js
      - profile-emblem-control.js
      - mobile-refresh.html
      - service-worker.js
      - scripts/validate-avatar-hotfix-adapters-extraction.mjs
      - scripts/validate-avatar-runtime-v556.mjs
      - scripts/validate-weekly-avatar-shards.mjs
      - scripts/validate-avatar-progression-v550.mjs
      - src/config/module-contracts.generated.json
      - docs/MODULE_CONTRACT_INVENTORY.md
      - .github/workflows/validate-avatar-hotfix-adapters-extraction.yml
  pull_request:
    paths:
      - avatar-progression-hotfix-v551.js
      - src/features/avatar/avatar-progression-model-v551.js
      - src/adapters/navigation/avatar-collections-navigation-v551.js
      - profile-emblem-control.js
      - mobile-refresh.html
      - service-worker.js
      - scripts/validate-avatar-hotfix-adapters-extraction.mjs
      - scripts/validate-avatar-runtime-v556.mjs
      - scripts/validate-weekly-avatar-shards.mjs
      - scripts/validate-avatar-progression-v550.mjs
      - src/config/module-contracts.generated.json
      - docs/MODULE_CONTRACT_INVENTORY.md
      - .github/workflows/validate-avatar-hotfix-adapters-extraction.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate adapter boundaries and compatibility
        run: node scripts/validate-avatar-hotfix-adapters-extraction.mjs
      - name: Validate avatar integration
        run: |
          node scripts/validate-avatar-runtime-v556.mjs
          node scripts/validate-weekly-avatar-shards.mjs
          node scripts/validate-avatar-progression-v550.mjs
          node scripts/validate-avatar-collection-screen.mjs
          node scripts/validate-persistent-navigation.mjs
      - name: Validate deterministic inventory
        run: node scripts/generate-module-contract-inventory-v2.mjs --check
      - name: Check whitespace
        run: git diff --check
