name: Validate modular bootstrap

on:
  pull_request:
    paths:
      - "app.html"
      - "bisaya.html"
      - "service-worker.js"
      - "src/**"
      - "scripts/validate_modular_bootstrap.py"
      - ".github/workflows/validate-modular-bootstrap.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "app.html"
      - "bisaya.html"
      - "service-worker.js"
      - "src/**"
      - "scripts/validate_modular_bootstrap.py"
      - ".github/workflows/validate-modular-bootstrap.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate modular bootstrap
        run: python scripts/validate_modular_bootstrap.py
