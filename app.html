<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6f67" />
  <title>Salita Quest — Loading</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#edf7f3;color:#173a37}
    body{display:grid;place-items:center}.loader{max-width:460px;padding:32px;text-align:center}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:#0b6f67;color:#fff;font-size:30px;font-weight:900;box-shadow:0 16px 34px rgba(11,111,103,.22)}
    h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#607773;line-height:1.55}.error{color:#9b3434}
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <div class="mark">S★</div>
    <h1>Opening your Tagalog journey…</h1>
    <p>Loading the Salita Quest course.</p>
  </main>
  <script>
    (async () => {
      "use strict";

      const SOURCE = "https://raw.githubusercontent.com/Costieman/SalitaQuest/cb89fa4778737b16408bd5a66dd8fcc7f7f37f81/index.html";
      const DOCUMENT_CACHE = "salitaQuestAppDocumentV53";
      const PROFILE_STORE = "salitaQuestLocalProfilesV1";
      const ACTIVE_PROFILE = "salitaQuestActiveProfileId";
      const ACTIVE_COURSE = "salitaQuestActiveCourse";
      const COURSE_ID = "tagalog";
      const BASE_PROGRESS = "salitaQuestProgress";
      const BASE_OWNER = "salitaQuestBaseProgressOwner";
      const PROFILE_PROGRESS_PREFIX = "salitaQuestProgress.profile.";

      function readProfiles() {
        try {
          const store = JSON.parse(localStorage.getItem(PROFILE_STORE) || "null");
          return store && Array.isArray(store.profiles) ? store.profiles : [];
        } catch {
          return [];
        }
      }

      function saveSharedProgress(owner, progress) {
        if (!owner || !progress) return;
        const separator = owner.lastIndexOf(":");
        const profileId = separator > 0 ? owner.slice(0, separator) : owner;
        const courseId = separator > 0 ? owner.slice(separator + 1) : "tagalog";
        if (!readProfiles().some(item => item.id === profileId)) return;
        localStorage.setItem(`${PROFILE_PROGRESS_PREFIX}${profileId}.${courseId}`, progress);
        if (courseId === "tagalog") localStorage.setItem(`${PROFILE_PROGRESS_PREFIX}${profileId}`, progress);
      }

      const activeId = sessionStorage.getItem(ACTIVE_PROFILE);
      const profile = readProfiles().find(item => item.id === activeId);
      if (!activeId || !profile) {
        window.location.replace("./");
        return;
      }

      const previousOwner = localStorage.getItem(BASE_OWNER);
      const sharedProgress = localStorage.getItem(BASE_PROGRESS);
      saveSharedProgress(previousOwner, sharedProgress);

      const courseProgressKey = `${PROFILE_PROGRESS_PREFIX}${activeId}.${COURSE_ID}`;
      const legacyProgressKey = `${PROFILE_PROGRESS_PREFIX}${activeId}`;
      const activeProgress = localStorage.getItem(courseProgressKey) || localStorage.getItem(legacyProgressKey);
      if (activeProgress) {
        localStorage.setItem(BASE_PROGRESS, activeProgress);
        localStorage.setItem(courseProgressKey, activeProgress);
      } else {
        localStorage.removeItem(BASE_PROGRESS);
      }
      localStorage.setItem(BASE_OWNER, `${activeId}:${COURSE_ID}`);
      sessionStorage.setItem(ACTIVE_COURSE, COURSE_ID);

      let html = "";
      try {
        const response = await fetch(SOURCE, { cache: "force-cache" });
        if (!response.ok) throw new Error(`Course document unavailable (${response.status})`);
        html = await response.text();
        if (!html.includes('id="homeView"') || !html.includes('src="app.js"')) {
          throw new Error("The retrieved course document was not recognised.");
        }
        try { localStorage.setItem(DOCUMENT_CACHE, html); } catch {}
      } catch (error) {
        try { html = localStorage.getItem(DOCUMENT_CACHE) || ""; } catch {}
        if (!html) {
          console.error(error);
          document.getElementById("loader").innerHTML = `
            <div class="mark">S★</div>
            <h1>Course files could not be loaded</h1>
            <p class="error">Check your connection, then reload this page. Your learner profile and saved progress remain on this device.</p>`;
          return;
        }
      }

      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="./"><link rel="stylesheet" href="ui-quality-fixes.css?v=5.4.11"><link rel="stylesheet" href="ui-answer-breakdown.css?v=5.4.11"><link rel="stylesheet" href="incorrect-order-feedback.css?v=5.4.11"><link rel="stylesheet" href="compact-desktop-layout.css?v=5.4.11"><link rel="stylesheet" href="mastery-feedback.css?v=5.4.11"><link rel="stylesheet" href="mastery-console-overrides.css?v=5.4.11">');
      html = html.replace(/<body([^>]*)>/i, '<body$1 data-course="tagalog">');
      html = html.replace(/<\/body>/i, '<script src="progression-v54.js?v=5.4.11"><\/script><script src="exercise-fixes-v545.js?v=5.4.11"><\/script><script src="ui-quality-fixes.js?v=5.4.11"><\/script><script src="incorrect-order-feedback.js?v=5.4.11"><\/script><script src="compact-desktop-layout.js?v=5.4.11"><\/script><script src="mastery-feedback.js?v=5.4.11"><\/script><script src="profile-app.js?v=5.4.11"><\/script></body>');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
