<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6f67" />
  <title>Salita Quest — Loading</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#edf7f3;color:#173a37}
    body{display:grid;place-items:center}.loader{max-width:460px;padding:32px;text-align:center}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:#0b6f67;color:#fff;font-size:30px;font-weight:900;box-shadow:0 16px 34px rgba(11,111,103,.22)}
    h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#607773;line-height:1.55}.error{color:#9b3434}
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <div class="mark">S★</div>
    <h1>Opening your Tagalog journey…</h1>
    <p>Loading the Salita Quest course.</p>
  </main>
  <script>
    (async () => {
      "use strict";
      const SOURCE = "https://raw.githubusercontent.com/Costieman/SalitaQuest/cb89fa4778737b16408bd5a66dd8fcc7f7f37f81/index.html";
      const CACHE_KEY = "salitaQuestAppDocumentV53";
      let html = "";

      try {
        const response = await fetch(SOURCE, { cache: "force-cache" });
        if (!response.ok) throw new Error(`Course document unavailable (${response.status})`);
        html = await response.text();
        if (!html.includes('id="homeView"') || !html.includes('src="app.js"')) {
          throw new Error("The retrieved course document was not recognised.");
        }
        try { localStorage.setItem(CACHE_KEY, html); } catch (_) {}
      } catch (error) {
        try { html = localStorage.getItem(CACHE_KEY) || ""; } catch (_) {}
        if (!html) {
          console.error(error);
          document.getElementById("loader").innerHTML = `
            <div class="mark">S★</div>
            <h1>Course files could not be loaded</h1>
            <p class="error">Check your connection, then reload this page. Your learner profile and saved progress remain on this device.</p>`;
          return;
        }
      }

      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="./">');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
