<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6f67" />
  <meta name="description" content="Salita Quest — local learner profiles with private progress stored on this device." />
  <title>Salita Quest — Learner Login</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="profile-shell.css" />
</head>
<body>
  <main id="profileGate" class="profile-gate" aria-live="polite">
    <section class="profile-brand" aria-label="Salita Quest">
      <div class="profile-brand-mark">S<span>★</span></div>
      <div>
        <p class="profile-eyebrow">LOCAL LEARNER PROFILES</p>
        <h1>Salita Quest</h1>
        <p>Your Tagalog journey stays on this device.</p>
      </div>
    </section>
    <section id="profilePanel" class="profile-panel"></section>
  </main>

  <section id="appStage" class="app-stage" hidden>
    <header class="profile-session-bar">
      <div class="profile-session-identity">
        <img id="activeProfileAvatar" alt="" />
        <div><small>LEARNING AS</small><strong id="activeProfileName"></strong></div>
      </div>
      <div class="profile-session-actions">
        <button id="changeLearnerBtn" type="button">Change learner</button>
        <button id="logoutLearnerBtn" type="button">Log out</button>
      </div>
    </header>
    <iframe id="salitaApp" title="Salita Quest learning application" src="about:blank" allow="autoplay; fullscreen; screen-wake-lock"></iframe>
  </section>

  <div id="profileToast" class="profile-toast" role="status" hidden></div>
  <script src="profile-shell.js"></script>
</body>
</html>
