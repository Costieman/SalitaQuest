<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6f67" />
  <meta name="description" content="Salita Quest — local learner profiles with private progress stored on this device." />
  <title>Salita Quest — Learner Login</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="profile-shell.css?v=5.4.13" />
</head>
<body>
  <main id="profileGate" class="profile-gate" aria-live="polite">
    <section class="profile-brand" aria-label="Salita Quest">
      <div class="profile-brand-mark">S<span>★</span></div>
      <div>
        <p class="profile-eyebrow">LOCAL LEARNER PROFILES</p>
        <h1>Salita Quest</h1>
        <p>Your Tagalog journey stays on this device.</p>
      </div>
    </section>
    <section id="profilePanel" class="profile-panel"><p>Loading learner profiles…</p></section>
  </main>
  <div id="profileToast" class="profile-toast" role="status" hidden></div>
  <script>
  (() => {
    "use strict";
    const STORE="salitaQuestLocalProfilesV1", ACTIVE="salitaQuestActiveProfileId", BASE="salitaQuestProgress", OWNER="salitaQuestBaseProgressOwner", PREFIX="salitaQuestProgress.profile.";
    const LEGACY=["salitaQuestStateV3","salitaQuestStateV2","salitaQuestState"];
    const AVATARS=[
      ["tarsier","Philippine Tarsier","A tiny forest primate known for its enormous eyes and incredible jumping ability."],
      ["eagle","Philippine Eagle","A powerful forest eagle with a striking feathered crest and impressive wingspan."],
      ["tamaraw","Tamaraw","A rare wild buffalo found only on the Philippine island of Mindoro."],
      ["peacock","Palawan Peacock-Pheasant","A beautiful forest bird with shimmering blue-green feathers and a delicate crest."],
      ["orchid","Waling-Waling Orchid","A spectacular Philippine orchid admired for its large, colourful flowers."],
      ["jade","Jade Vine","A tropical climbing plant with unusual turquoise flowers shaped like curved claws."],
      ["rafflesia","Philippine Rafflesia","A remarkable rainforest flower known for its enormous, spotted red petals."],
      ["anahaw","Anahaw","A native fan palm whose broad green leaves are a familiar Philippine symbol."]
    ].map(([id,title,description])=>({id,title,description,src:`avatars/${id}.png`}));
    const panel=document.getElementById("profilePanel"), toast=document.getElementById("profileToast");
    const esc=value=>String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
    const avatar=id=>AVATARS.find(item=>item.id===id)||AVATARS[0];
    function read(){try{const value=JSON.parse(localStorage.getItem(STORE)||"null");return value&&Array.isArray(value.profiles)?value:{schemaVersion:1,profiles:[]};}catch{return{schemaVersion:1,profiles:[]};}}
    function write(store){store.schemaVersion=1;store.updatedAt=new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(store));}
    const progressKey=id=>PREFIX+id;
    function makeId(){return crypto.randomUUID?crypto.randomUUID():[...crypto.getRandomValues(new Uint8Array(16))].map(v=>v.toString(16).padStart(2,"0")).join("");}
    function makeSalt(){return[...crypto.getRandomValues(new Uint8Array(16))].map(v=>v.toString(16).padStart(2,"0")).join("");}
    async function hashPin(pin,salt){const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(`${salt}:${pin}`));return[...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,"0")).join("");}
    function showToast(message){toast.textContent=message;toast.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.hidden=true,3000);}
    function findLegacy(){let value=localStorage.getItem(BASE);if(value)return value;for(const key of LEGACY){value=localStorage.getItem(key);if(value)return value;}return null;}
    function recoverOwner(){const owner=localStorage.getItem(OWNER),progress=localStorage.getItem(BASE);if(owner&&progress&&read().profiles.some(p=>p.id===owner))localStorage.setItem(progressKey(owner),progress);}
    function loadProgress(profile){recoverOwner();const progress=localStorage.getItem(progressKey(profile.id));if(progress)localStorage.setItem(BASE,progress);else localStorage.removeItem(BASE);localStorage.setItem(OWNER,profile.id);}
    function clearShared(){localStorage.removeItem(BASE);localStorage.removeItem(OWNER);}
    function openProfile(profile){const store=read(),saved=store.profiles.find(p=>p.id===profile.id);if(!saved)return renderChoices();saved.lastUsedAt=new Date().toISOString();write(store);loadProgress(saved);sessionStorage.setItem(ACTIVE,saved.id);try{navigator.storage?.persist?.();}catch{}window.location.replace(`app.html?profile=${encodeURIComponent(saved.id)}`);}
    function renderChoices(){const store=read(),profiles=[...store.profiles].sort((a,b)=>String(b.lastUsedAt||"").localeCompare(String(a.lastUsedAt||""))),has=profiles.length>0;panel.innerHTML=`<div class="profile-panel-header"><div><p class="profile-eyebrow">WELCOME</p><h2>${has?"Choose your learner":"Create your first learner"}</h2><p>${has?"Select a local profile and enter its PIN.":"Each learner receives separate progress on this device."}</p></div></div>${has?`<div class="profile-list">${profiles.map(p=>{const a=avatar(p.avatarId);return`<button class="profile-choice" type="button" data-profile="${p.id}"><img src="${a.src}" alt=""><span><strong>${esc(p.name)}</strong><small>${esc(a.title)}</small></span></button>`;}).join("")}<button class="profile-choice profile-add-card" type="button" data-new><span class="profile-add-icon">＋</span><span>Add another learner</span></button></div>`:`<button class="profile-btn" type="button" data-new>Create learner profile</button>`}<div class="profile-info-note"><strong>Stored locally:</strong> clearing website data, private browsing, or changing browsers may remove access. Keep using JSON backups.</div>`;}
    function renderLogin(id){const profile=read().profiles.find(p=>p.id===id);if(!profile)return renderChoices();const a=avatar(profile.avatarId);panel.innerHTML=`<div class="profile-login-title"><img class="profile-login-avatar" src="${a.src}" alt=""><p class="profile-eyebrow">${esc(a.title).toUpperCase()}</p><h2>${esc(profile.name)}</h2><p>Enter your local PIN to continue.</p></div><form id="loginForm" class="profile-form"><label class="profile-field"><span>PIN</span><input id="loginPin" type="password" inputmode="numeric" minlength="4" maxlength="6" pattern="[0-9]{4,6}" required autofocus><small>Four to six numbers.</small></label><div id="profileError" class="profile-error"></div><div class="profile-actions"><button class="profile-btn secondary" type="button" data-back>Back</button><button class="profile-btn" type="submit">Open Salita Quest</button></div></form><div class="profile-info-note">This is a casual local profile lock, not a secure online account.</div>`;document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();const pin=document.getElementById("loginPin").value.trim(),error=document.getElementById("profileError"),submit=event.submitter;if(!/^\d{4,6}$/.test(pin)){error.textContent="Enter the four- to six-digit PIN.";return;}submit.disabled=true;submit.textContent="Checking…";if(await hashPin(pin,profile.pinSalt)!==profile.pinHash){error.textContent="That PIN is not correct.";submit.disabled=false;submit.textContent="Open Salita Quest";document.getElementById("loginPin").select();return;}openProfile(profile);});}
    function renderCreate(){const has=read().profiles.length>0;panel.innerHTML=`<div class="profile-panel-header"><div><p class="profile-eyebrow">NEW LOCAL PROFILE</p><h2>Create a learner</h2><p>Choose a Philippine species avatar and protect the profile with a PIN.</p></div></div><form id="createForm" class="profile-form"><label class="profile-field"><span>Learner name</span><input id="learnerName" maxlength="24" required></label><div class="profile-pin-row"><label class="profile-field"><span>Create PIN</span><input id="newPin" type="password" inputmode="numeric" minlength="4" maxlength="6" required></label><label class="profile-field"><span>Confirm PIN</span><input id="confirmPin" type="password" inputmode="numeric" minlength="4" maxlength="6" required></label></div><div class="profile-avatar-heading"><strong>Choose your avatar</strong><small>Philippine native flora and fauna</small></div><div class="avatar-grid">${AVATARS.map((a,i)=>`<div class="avatar-option"><input id="avatar-${a.id}" type="radio" name="avatar" value="${a.id}" ${i===0?"checked":""}><label for="avatar-${a.id}"><img src="${a.src}" alt=""><strong>${a.title}</strong><small>${a.description}</small></label></div>`).join("")}</div><label class="profile-consent"><input id="storageConsent" type="checkbox" required><span>I understand that this learner’s profile and progress will be stored in this browser on this device.</span></label><div id="profileError" class="profile-error"></div><div class="profile-actions">${has?'<button class="profile-btn secondary" type="button" data-back>Back</button>':""}<button class="profile-btn" type="submit">Create and continue</button></div></form>`;document.getElementById("createForm").addEventListener("submit",async event=>{event.preventDefault();const store=read(),name=document.getElementById("learnerName").value.trim().replace(/\s+/g," "),pin=document.getElementById("newPin").value.trim(),confirm=document.getElementById("confirmPin").value.trim(),error=document.getElementById("profileError");if(!name||name.length>24){error.textContent="Enter a learner name of up to 24 characters.";return;}if(store.profiles.some(p=>p.name.toLowerCase()===name.toLowerCase())){error.textContent="That learner name already exists.";return;}if(!/^\d{4,6}$/.test(pin)){error.textContent="Create a PIN containing four to six numbers.";return;}if(pin!==confirm){error.textContent="The PIN entries do not match.";return;}if(!document.getElementById("storageConsent").checked){error.textContent="Accept local storage before continuing.";return;}const salt=makeSalt(),profile={id:makeId(),name,avatarId:document.querySelector('input[name="avatar"]:checked').value,pinSalt:salt,pinHash:await hashPin(pin,salt),createdAt:new Date().toISOString(),lastUsedAt:new Date().toISOString(),consentVersion:1},existing=store.profiles.length?null:findLegacy();store.profiles.push(profile);write(store);if(existing)localStorage.setItem(progressKey(profile.id),existing);showToast(existing?"Profile created. Existing progress was preserved.":"Learner profile created.");openProfile(profile);});}
    panel.addEventListener("click",event=>{const target=event.target.closest("[data-profile],[data-new],[data-back]");if(!target)return;if(target.dataset.profile)renderLogin(target.dataset.profile);else if(target.hasAttribute("data-new"))renderCreate();else renderChoices();});
    try{localStorage.setItem("__sq_test","1");localStorage.removeItem("__sq_test");recoverOwner();const store=read(),active=store.profiles.find(p=>p.id===sessionStorage.getItem(ACTIVE));if(active){loadProgress(active);window.location.replace(`app.html?profile=${encodeURIComponent(active.id)}`);}else{sessionStorage.removeItem(ACTIVE);clearShared();renderChoices();}}catch(error){console.error(error);panel.innerHTML='<h2>Local storage is unavailable</h2><p>Leave private browsing or enable site storage, then reload.</p>';}
    if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js?v=5.4.13").catch(()=>{});
  })();
  </script>
</body>
</html>
